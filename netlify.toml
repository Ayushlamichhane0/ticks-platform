[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 3000

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://*.tradingview.com https://*.tradingview-widget.com; worker-src 'self' blob: https://*.tradingview.com https://*.tradingview-widget.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.tradingview.com https://*.tradingview-widget.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tradingview.com https://*.tradingview-widget.com https://s3.tradingview.com; frame-src 'self' https://*.tradingview.com https://*.tradingview-widget.com; connect-src 'self' https://api.twelvedata.com https://api.binance.com wss://stream.binance.com https://*.tradingview.com https://*.tradingview-widget.com wss://*.tradingview.com wss://*.tradingview-widget.com https://ep-lingering-bread-a1r5wnr5.neonauth.ap-southeast-1.aws.neon.tech; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
