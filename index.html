<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            window.fetch = window.fetch;
          } catch (_) {}
        }

        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Ticks - Smart Tools for Traders & Developers</title>
    <meta
